name: 🧪 CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 🔍 Syntax check every module
        run: for f in $(find www/src scripts -name '*.js' -o -name '*.mjs'); do node --check "$f" || exit 1; done
      - name: 🤖 Headless bot plays every difficulty (crash + balance smoke test)
        run: |
          node scripts/simulate.mjs 4 easy
          node scripts/simulate.mjs 3 normal
          node scripts/simulate.mjs 2 hard
