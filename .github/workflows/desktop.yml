name: 💻 Desktop (Windows / macOS / Linux)

on:
  push: { tags: ['v*'] }
  workflow_dispatch:

permissions: { contents: write }

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, flag: --win, files: 'dist/*.exe' }
          - { os: macos-latest, flag: --mac, files: 'dist/*.dmg' }
          - { os: ubuntu-latest, flag: --linux, files: 'dist/*.AppImage' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 📦 Install Electron
        run: npm install --no-save --no-audit --no-fund electron@31 electron-builder@25
      - name: 🔨 Package
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned builds (add certs later for store-ready signing)
      - uses: actions/upload-artifact@v4
        with: { name: 'slimefall-${{ matrix.os }}', path: '${{ matrix.files }}' }
      - name: 🚀 Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: '${{ matrix.files }}' }
